name: Quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}

      - name: Verify exact revision
        shell: bash
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "Expected $EXPECTED_SHA but checked out $actual_sha" >&2
            exit 1
          fi
          echo "Verified exact revision: $actual_sha"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify all nine Playbook assets
        run: npm run verify:playbooks

      - name: Run tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Verify managed-service wording and Playbook delivery routes
        run: npm run verify:managed-service

      - name: Audit all and production dependencies
        shell: bash
        run: |
          set +e
          npm audit --audit-level=moderate
          all_audit_status=$?
          npm audit --omit=dev --audit-level=moderate
          production_audit_status=$?
          set -e
          if (( all_audit_status != 0 || production_audit_status != 0 )); then
            echo "Dependency audit failed: all=$all_audit_status production=$production_audit_status" >&2
            exit 1
          fi
