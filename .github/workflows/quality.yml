name: Quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_SHA }}

      - name: Verify exact revision
        shell: bash
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "Expected $EXPECTED_SHA but checked out $actual_sha" >&2
            exit 1
          fi
          echo "Verified exact revision: $actual_sha"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify all nine Playbook assets
        run: npm run verify:playbooks

      - name: Run tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Verify managed-service wording and Playbook delivery routes
        run: npm run verify:managed-service

      - name: Audit all and production dependencies
        shell: bash
        run: |
          set +e
          npm run audit:security -- --output=dependency-audit-result.json
          audit_status=$?
          set -e
          if [[ -f dependency-audit-result.json ]]; then
            jq '{status, rawCounts, applicable, productionOnlyFindings, gateErrors, dependencyGraphProof, patchAvailabilityProof, artifactProof}' dependency-audit-result.json
            if [[ "$audit_status" -ne 0 ]]; then
              compact_errors="$(jq -c '{status,applicable,productionOnlyFindings,gateErrors}' dependency-audit-result.json)"
              echo "::error title=Dependency audit gate failed::$compact_errors"
            fi
          fi
          exit "$audit_status"

      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit-${{ env.EXPECTED_SHA }}
          path: dependency-audit-result.json
          if-no-files-found: error
          retention-days: 30
