name: Inspect staged playbook suite payload

on:
  push:
    branches:
      - codex/managed-service-clarity-20260824
    paths:
      - .github/workflows/inspect-playbook-suite-payload.yml
      - tmp/playbook-suite-payload/**

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/managed-service-clarity-20260824
          fetch-depth: 0

      - name: Reconstruct and inspect archive
        run: |
          set -euo pipefail
          mkdir -p /tmp/playbook-suite-inspect/extracted
          cat tmp/playbook-suite-payload/part-* > /tmp/playbook-suite-inspect/payload.b64
          base64 --decode /tmp/playbook-suite-inspect/payload.b64 > /tmp/playbook-suite-inspect/payload.zip
          unzip -t /tmp/playbook-suite-inspect/payload.zip
          unzip -q /tmp/playbook-suite-inspect/payload.zip -d /tmp/playbook-suite-inspect/extracted
          {
            echo "Staged playbook suite payload inspection"
            echo
            sha256sum /tmp/playbook-suite-inspect/payload.zip
            echo
            find /tmp/playbook-suite-inspect/extracted -type f -printf '%P\t%s bytes\n' | sort
          } | tee tmp/playbook-suite-inspection.txt

      - name: Commit inspection result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/playbook-suite-inspection.txt
          if git diff --cached --quiet; then
            echo "Inspection result already current."
            exit 0
          fi
          git commit -m "Inspect staged multilingual playbook suite payload"
          git push origin HEAD:codex/managed-service-clarity-20260824
