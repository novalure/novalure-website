name: Inspect staged playbook suite payload

on:
  push:
    branches:
      - codex/managed-service-clarity-20260824
    paths:
      - .github/workflows/inspect-playbook-suite-payload.yml
      - tmp/playbook-suite-payload/**

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/managed-service-clarity-20260824
          fetch-depth: 0

      - name: Reconstruct and inspect archive without hiding diagnostics
        run: |
          set +e
          mkdir -p /tmp/playbook-suite-inspect/extracted
          cat tmp/playbook-suite-payload/part-* > /tmp/playbook-suite-inspect/payload.b64
          base64 --decode /tmp/playbook-suite-inspect/payload.b64 > /tmp/playbook-suite-inspect/payload.zip 2> /tmp/playbook-suite-inspect/base64-error.txt
          decode_status=$?
          unzip -t /tmp/playbook-suite-inspect/payload.zip > /tmp/playbook-suite-inspect/unzip-test.txt 2>&1
          unzip_status=$?
          if [ "$unzip_status" -eq 0 ]; then
            unzip -q /tmp/playbook-suite-inspect/payload.zip -d /tmp/playbook-suite-inspect/extracted
          fi
          {
            echo "Staged playbook suite payload inspection"
            echo "decode_status=$decode_status"
            echo "unzip_status=$unzip_status"
            echo "parts=$(find tmp/playbook-suite-payload -maxdepth 1 -type f | wc -l)"
            echo "base64_bytes=$(wc -c < /tmp/playbook-suite-inspect/payload.b64)"
            echo "zip_bytes=$(wc -c < /tmp/playbook-suite-inspect/payload.zip)"
            echo
            cat /tmp/playbook-suite-inspect/base64-error.txt
            echo
            cat /tmp/playbook-suite-inspect/unzip-test.txt
            echo
            if [ -s /tmp/playbook-suite-inspect/payload.zip ]; then sha256sum /tmp/playbook-suite-inspect/payload.zip; fi
            echo
            find /tmp/playbook-suite-inspect/extracted -type f -printf '%P\t%s bytes\n' | sort
          } > tmp/playbook-suite-inspection.txt
          cat tmp/playbook-suite-inspection.txt
          exit 0

      - name: Commit inspection result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/playbook-suite-inspection.txt
          if git diff --cached --quiet; then
            echo "Inspection result already current."
            exit 0
          fi
          git commit -m "Record staged playbook payload diagnostics"
          git push origin HEAD:codex/managed-service-clarity-20260824
