name: Refresh managed-service playbook assets

on:
  push:
    branches:
      - codex/managed-service-clarity-20260824
    paths:
      - scripts/apply-managed-service-playbook-copy.mjs
      - .github/workflows/managed-service-playbook-assets.yml

permissions:
  contents: write

jobs:
  refresh-playbooks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/managed-service-clarity-20260824
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF renderer dependencies
        run: python -m pip install --disable-pip-version-check reportlab lxml pillow

      - name: Apply managed-service wording
        run: node scripts/apply-managed-service-playbook-copy.mjs

      - name: Regenerate all six playbook PDFs
        run: python scripts/render-playbook-pdfs.py

      - name: Commit refreshed source and assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/relaunch-copy.ts content/spanish-market-positioning.ts scripts/generate-playbooks.mjs public/playbooks/developer-pipeline-playbook-en.html public/playbooks/*.pdf
          if git diff --cached --quiet; then
            echo "No managed-service source or playbook changes to commit."
            exit 0
          fi
          git commit -m "Clarify managed-service wording in source and playbooks"
          git push origin HEAD:codex/managed-service-clarity-20260824
