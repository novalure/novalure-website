name: Visual managed-service QA

on:
  pull_request:
    paths:
      - .github/workflows/visual-managed-service-qa.yml

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Selenium for visual QA
        run: |
          python -m pip install --disable-pip-version-check selenium==4.35.0
          google-chrome --version
          chromedriver --version

      - name: Build production bundle
        run: npm run build

      - name: Start production server
        run: |
          npm run start -- --hostname 127.0.0.1 --port 4312 > /tmp/novalure-visual-qa.log 2>&1 &
          echo $! > /tmp/novalure-visual-qa.pid
          for attempt in {1..120}; do
            if curl --fail --silent http://127.0.0.1:4312/en > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/novalure-visual-qa.log
          exit 1

      - name: Capture desktop and mobile screenshots
        run: |
          python - <<'PY'
          import json
          import pathlib
          import time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options

          origin = "http://127.0.0.1:4312"
          routes = [
              ("de-home", "/de", "Systembeispiel ansehen"),
              ("en-home", "/en", "View system example"),
              ("es-home", "/es", "Ver ejemplo del sistema"),
              ("de-developers", "/de/bautraeger", "NovaLure betreibt den Lead- und Vertriebsprozess für Ihr Mandat."),
              ("en-developers", "/en/developers", "NovaLure operates the lead and sales process for each mandate."),
              ("es-developers", "/es/promotores", "NovaLure opera el proceso de captación y gestión comercial para cada encargo."),
              ("de-system", "/de/systembeispiel", "NovaLure betreibt den Lead- und Vertriebsprozess für Ihr Mandat."),
              ("en-system", "/en/system-example", "NovaLure operates the lead and sales process for each mandate."),
              ("es-system", "/es/ejemplo-del-sistema", "NovaLure opera el proceso de captación y gestión comercial para cada encargo."),
          ]
          viewports = [
              ("desktop", 1440, 1000),
              ("mobile", 390, 844),
          ]
          forbidden = ["CRM-Login", "CRM login", "Acceso al CRM", "https://novalure-crm.app"]
          output = pathlib.Path("visual-qa")
          output.mkdir(parents=True, exist_ok=True)
          results = []

          options = Options()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--disable-gpu")
          options.add_argument("--hide-scrollbars")
          options.add_argument("--force-device-scale-factor=1")
          driver = webdriver.Chrome(options=options)

          try:
              for name, route, expected in routes:
                  for viewport_name, width, height in viewports:
                      driver.set_window_size(width, height)
                      driver.get(f"{origin}{route}")
                      driver.execute_script(
                          """
                          const style = document.createElement('style');
                          style.textContent = '*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}[data-reveal]{opacity:1!important;transform:none!important}';
                          document.head.appendChild(style);
                          """
                      )
                      time.sleep(0.5)

                      body_text = driver.find_element(By.TAG_NAME, "body").text
                      if expected not in body_text:
                          raise RuntimeError(f"{route} is missing expected text: {expected}")
                      for phrase in forbidden:
                          if phrase in body_text:
                              raise RuntimeError(f"{route} still contains {phrase}")

                      metrics = driver.execute_script(
                          """
                          return {
                            clientWidth: document.documentElement.clientWidth,
                            scrollWidth: document.documentElement.scrollWidth,
                            title: document.title,
                            h1: document.querySelector('h1')?.textContent?.trim() || ''
                          };
                          """
                      )
                      if metrics["scrollWidth"] > metrics["clientWidth"] + 1:
                          raise RuntimeError(
                              f"{route} has horizontal overflow at {viewport_name}: "
                              f"{metrics['scrollWidth']}px > {metrics['clientWidth']}px"
                          )

                      driver.execute_script("window.scrollTo(0, 0)")
                      time.sleep(0.1)
                      driver.save_screenshot(output / f"{name}-{viewport_name}-top.png")

                      managed_selector = ".v3-system" if name.endswith("home") else '[aria-labelledby^="managed-service-"]'
                      managed_elements = driver.find_elements(By.CSS_SELECTOR, managed_selector)
                      if not managed_elements:
                          raise RuntimeError(f"{route} has no managed-service visual target")
                      managed_element = managed_elements[0]
                      driver.execute_script("arguments[0].scrollIntoView({block: 'center'});", managed_element)
                      time.sleep(0.2)
                      managed_element.screenshot(output / f"{name}-{viewport_name}-managed.png")

                      if viewport_name == "mobile" and name.endswith("home"):
                          driver.execute_script("window.scrollTo(0, 0)")
                          time.sleep(0.1)
                          driver.find_element(By.CSS_SELECTOR, "button.menu-toggle").click()
                          time.sleep(0.2)
                          driver.save_screenshot(output / f"{name}-mobile-menu.png")

                      results.append({"name": name, "path": route, "viewport": viewport_name, **metrics})
          finally:
              driver.quit()

          (output / "results.json").write_text(json.dumps(results, ensure_ascii=False, indent=2), encoding="utf-8")
          PY

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/novalure-visual-qa.pid ]; then
            kill "$(cat /tmp/novalure-visual-qa.pid)" || true
          fi

      - name: Upload visual QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed-service-visual-qa
          path: |
            visual-qa
            /tmp/novalure-visual-qa.log
          if-no-files-found: warn
          retention-days: 7
