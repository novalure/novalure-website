name: Visual managed-service QA

on:
  pull_request:
    paths:
      - .github/workflows/visual-managed-service-qa.yml

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright for visual QA
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Start production server
        run: |
          npm run start -- --hostname 127.0.0.1 --port 4312 > /tmp/novalure-visual-qa.log 2>&1 &
          echo $! > /tmp/novalure-visual-qa.pid
          for attempt in {1..120}; do
            if curl --fail --silent http://127.0.0.1:4312/en > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/novalure-visual-qa.log
          exit 1

      - name: Capture desktop and mobile screenshots
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs/promises";
          import { chromium } from "playwright";

          const origin = "http://127.0.0.1:4312";
          const routes = [
            ["de-home", "/de", "Systembeispiel ansehen"],
            ["en-home", "/en", "View system example"],
            ["es-home", "/es", "Ver ejemplo del sistema"],
            ["de-developers", "/de/bautraeger", "NovaLure betreibt den Lead- und Vertriebsprozess für Ihr Mandat."],
            ["en-developers", "/en/developers", "NovaLure operates the lead and sales process for each mandate."],
            ["es-developers", "/es/promotores", "NovaLure opera el proceso de captación y gestión comercial para cada encargo."],
            ["de-system", "/de/systembeispiel", "NovaLure betreibt den Lead- und Vertriebsprozess für Ihr Mandat."],
            ["en-system", "/en/system-example", "NovaLure operates the lead and sales process for each mandate."],
            ["es-system", "/es/ejemplo-del-sistema", "NovaLure opera el proceso de captación y gestión comercial para cada encargo."]
          ];
          const viewports = [
            ["desktop", { width: 1440, height: 1000 }],
            ["mobile", { width: 390, height: 844 }]
          ];
          const forbidden = ["CRM-Login", "CRM login", "Acceso al CRM", "https://novalure-crm.app"];
          const results = [];

          await fs.mkdir("visual-qa", { recursive: true });
          const browser = await chromium.launch({ headless: true });

          try {
            for (const [name, path, expected] of routes) {
              for (const [viewportName, viewport] of viewports) {
                const page = await browser.newPage({ viewport });
                await page.goto(`${origin}${path}`, { waitUntil: "domcontentloaded" });
                await page.addStyleTag({
                  content: "*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}[data-reveal]{opacity:1!important;transform:none!important}"
                });
                await page.waitForTimeout(400);

                const bodyText = await page.locator("body").innerText();
                if (!bodyText.includes(expected)) throw new Error(`${path} is missing expected text: ${expected}`);
                for (const phrase of forbidden) {
                  if (bodyText.includes(phrase)) throw new Error(`${path} still contains ${phrase}`);
                }

                const metrics = await page.evaluate(() => ({
                  clientWidth: document.documentElement.clientWidth,
                  scrollWidth: document.documentElement.scrollWidth,
                  title: document.title,
                  h1: document.querySelector("h1")?.textContent?.trim() || ""
                }));
                if (metrics.scrollWidth > metrics.clientWidth + 1) {
                  throw new Error(`${path} has horizontal overflow at ${viewportName}: ${metrics.scrollWidth}px > ${metrics.clientWidth}px`);
                }

                await page.screenshot({ path: `visual-qa/${name}-${viewportName}.png`, fullPage: true });
                results.push({ name, path, viewport: viewportName, ...metrics });

                if (viewportName === "mobile" && name.endsWith("home")) {
                  await page.locator("button.menu-toggle").click();
                  await page.waitForTimeout(150);
                  await page.screenshot({ path: `visual-qa/${name}-mobile-menu.png`, fullPage: false });
                }
                await page.close();
              }
            }
          } finally {
            await browser.close();
          }

          await fs.writeFile("visual-qa/results.json", JSON.stringify(results, null, 2));
          NODE

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/novalure-visual-qa.pid ]; then
            kill "$(cat /tmp/novalure-visual-qa.pid)" || true
          fi

      - name: Upload visual QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed-service-visual-qa
          path: |
            visual-qa
            /tmp/novalure-visual-qa.log
          if-no-files-found: warn
          retention-days: 7
