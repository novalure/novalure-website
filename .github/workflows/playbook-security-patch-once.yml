name: Playbook release dependency patches
on:
  push:
    branches: [codex/playbook-form-readability-2026-09-17]
    paths: [.github/workflows/playbook-security-patch-once.yml]
permissions:
  contents: write
jobs:
  patch:
    if: github.repository == 'novalure/novalure-website' && github.ref == 'refs/heads/codex/playbook-form-readability-2026-09-17'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/playbook-form-readability-2026-09-17
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Initialize the exact locked dependency tree
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply reviewed patch versions without major upgrades
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'package.json';
          const p = JSON.parse(fs.readFileSync(file, 'utf8'));
          p.dependencies.next = '15.5.24';
          p.dependencies.sharp = '0.35.4';
          p.devDependencies['eslint-config-next'] = '15.5.24';
          p.devDependencies.vitest = '4.1.11';
          p.overrides['@sanity/runtime-cli']['adm-zip'] = '0.6.1';
          p.overrides['@vercel/frameworks']['js-yaml'] = '3.15.2';
          p.overrides['js-yaml@^3.0.0'] = '3.15.2';
          p.overrides['js-yaml@^4.0.0'] = '4.3.2';
          fs.writeFileSync(file, JSON.stringify(p, null, 2) + '\n');
          NODE
          npm install --ignore-scripts --no-audit --no-fund || { tail -n 100 "$(ls -t ~/.npm/_logs/*debug* | head -n 1)"; exit 1; }
      - name: Validate the regenerated lock and dependencies
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=moderate
          npm audit --omit=dev --audit-level=moderate
          npm test
          npm run lint
          npm run typecheck
          npm run verify:playbooks
      - name: Commit only dependency manifests on the authorized preview branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Patch Next.js, sharp, Vitest, YAML and ZIP dependencies for release'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/codex/playbook-form-readability-2026-09-17
          echo "Validated dependency patch commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
